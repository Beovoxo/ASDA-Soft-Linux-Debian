[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asda-soft-linux"
version = "0.1.0"
description = "Independent Linux configuration workspace for Delta ASDA servo drives"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Beovoxo" }]
keywords = ["delta", "asda-a2", "linuxcnc", "debian", "servo", "automation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = ["PySide6>=6.6", "pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
asda-soft-linux = "asda_linux.app:main"

[tool.setuptools.packages.find]
include = ["asda_linux*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
